# Resets the public demo deployment to fresh sample data every 12 hours.
# Vercel Hobby only runs crons once a day, so the schedule lives here instead.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEMO_APP_URL      e.g. https://setu-workflow-demo.vercel.app (no trailing slash)
#   DEMO_CRON_SECRET  the CRON_SECRET set on the demo Vercel project
#
# Run it by hand from the Actions tab ("Run workflow") to seed the demo the first time.
name: Demo reset
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:
concurrency:
  group: demo-reset
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reset the demo data
        env:
          DEMO_APP_URL: ${{ secrets.DEMO_APP_URL }}
          DEMO_CRON_SECRET: ${{ secrets.DEMO_CRON_SECRET }}
        run: |
          if [ -z "$DEMO_APP_URL" ] || [ -z "$DEMO_CRON_SECRET" ]; then
            echo "DEMO_APP_URL / DEMO_CRON_SECRET are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            --retry 2 --retry-delay 30 --retry-all-errors \
            -X POST -H "Authorization: Bearer $DEMO_CRON_SECRET" \
            "$DEMO_APP_URL/api/cron/demo-reset"
